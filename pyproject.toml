[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-quote-normalizer"
version = "0.1.0"
description = "Normalize contractor estimates for side-by-side comparison."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx2>=2.12,<3.0",
  "openai>=2.0,<3.0",
  "pydantic>=2.11,<3.0",
  "pypdf>=6.0,<7.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn>=0.35,<1.0",
]

[project.scripts]
quote-normalizer = "app.cli:main"

[tool.setuptools]
packages = ["app"]
